# Codemagic workflow for MypracticalApp (Expo SDK 54 + native modules)
# Builds a signed Android AAB via Expo Prebuild + Gradle.

workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 120
    environment:
      vars:
        EXPO_PUBLIC_API_URL: ""
      # Keystore variables are read from the `keystore` environment group
      # (Codemagic UI → App settings → Environment variables → groups → keystore):
      #   CM_KEYSTORE             base64 of your .jks
      #   CM_KEYSTORE_PASSWORD    store password
      #   CM_KEY_ALIAS            key alias
      #   CM_KEY_PASSWORD         key password
      groups:
        - keystore
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Print SHA-1 / SHA-256 fingerprint for Firebase / Google Sign-In
        script: |
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -alias "$CM_KEY_ALIAS" -storepass "$CM_KEYSTORE_PASSWORD" \
            | grep -E "SHA1|SHA256" || true
      - name: Generate native Android project
        script: |
          npx expo prebuild --platform android --clean
      - name: Configure release signing in gradle.properties
        script: |
          cp "$CM_KEYSTORE_PATH" android/app/upload-keystore.jks
          echo "MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=$CM_KEY_ALIAS" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=$CM_KEY_PASSWORD" >> android/gradle.properties
      - name: Build signed release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - 157237445+DineshWebDev2003@users.noreply.github.com
        notify:
          success: true
          failure: true
