# Codemagic workflow for MypracticalApp (Expo SDK 54 + native modules)
# DEBUG build only — produces a debug-signed APK you can install on any device.
# No keystore / signing variables required.

workflows:
  react-native-expo-android:
    name: React Native Expo Android
    max_build_duration: 120
    environment:
      vars:
        EXPO_PUBLIC_API_URL: ""
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Generate native Android project
        script: |
          npx expo prebuild --platform android --clean
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - 157237445+DineshWebDev2003@users.noreply.github.com
        notify:
          success: true
          failure: true
