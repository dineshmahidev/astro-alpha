# Codemagic workflow for Koshmira (Expo SDK 54 + native modules)
# Builds DEBUG APK + AAB with auto-incrementing version code.
#
# Env group `android_signing` must contain:
#   CM_KEYSTORE             base64 of my-upload-key.jks
#   CM_KEYSTORE_PASSWORD    store password
#   CM_KEY_ALIAS            key alias
#   CM_KEY_PASSWORD         key password
# Env group `firebase` must contain:
#   GOOGLE_SERVICES_JSON    base64 of google-services.json

workflows:
  koshmira-android:
    name: Koshmira Android (Debug + AAB)
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: develop
          include: true
    environment:
      groups:
        - android_signing
        - firebase
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Decode Firebase config
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json
          ls -la google-services.json

      - name: Auto-increment version code
        script: |
          # Read current versionCode from app.json android.versionCode
          CURRENT=$(node -p "require('./app.json').expo.android.versionCode || 1")
          NEW=$((CURRENT + 1))
          echo "Version code: $CURRENT -> $NEW"

          # Update app.json
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = $NEW;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

          # Also update build.gradle if prebuild already ran
          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionCode [0-9]*/versionCode $NEW/" android/app/build.gradle
          fi

          echo "VERSION_CODE=$NEW" >> $CM_ENV
          git config --global user.name "Codemagic"
          git config --global user.email "ci@codemagic.io"
          git add app.json
          git diff --cached --quiet || git commit -m "chore: bump version code to $NEW [skip ci]"
          git push origin HEAD || true

      - name: Generate native Android project
        script: |
          npx expo prebuild --platform android --clean

      - name: Configure signing (debug + release same keystore)
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          echo "" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=$CM_KEY_ALIAS" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=$CM_KEY_PASSWORD" >> android/gradle.properties

          # Patch debug signingConfig to use same keystore
          node -e "
            const fs = require('fs');
            const f = 'android/app/build.gradle';
            let c = fs.readFileSync(f, 'utf8');
            c = c.replace(/storeFile\s+file\(['\"]debug\.keystore['\"]\)/, \"storeFile file('upload-keystore.jks')\");
            c = c.replace(/storePassword\s+['\"]android['\"]/, \"storePassword System.getenv('CM_KEYSTORE_PASSWORD')\");
            c = c.replace(/keyAlias\s+['\"]androiddebugkey['\"]/, \"keyAlias System.getenv('CM_KEY_ALIAS')\");
            c = c.replace(/keyPassword\s+['\"]android['\"]/, \"keyPassword System.getenv('CM_KEYSTORE_PASSWORD')\");
            fs.writeFileSync(f, c);
            console.log('debug signingConfig patched');
          "

      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug

      - name: Build release AAB (Google Play)
        script: |
          cd android
          ./gradlew bundleRelease

      - name: Print signing fingerprint
        script: |
          keytool -list -v -keystore android/app/upload-keystore.jks -alias "$CM_KEY_ALIAS" -storepass "$CM_KEYSTORE_PASSWORD" \
            | grep -E "SHA1|SHA256" || true

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - 157237445+DineshWebDev2003@users.noreply.github.com
        notify:
          success: true
          failure: true
